name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into binaries (e.g. 0.6.0). Leave blank for a dev build."
        required: false
        default: ""
      release_type:
        description: "Release type"
        required: false
        type: choice
        options:
          - "Full Release"
          - "Pre Release"
        default: "Full Release"

env:
  RAYLIB_VERSION: "5.5"

jobs:

  # ---------------------------------------------------------------------
  # Resolve the version once, from the pushed tag or the manual input,
  # so every platform build stamps the exact same string.
  # ---------------------------------------------------------------------
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      prerelease: ${{ steps.get_version.outputs.prerelease }}
      release_label: ${{ steps.get_version.outputs.release_label }}
    steps:
      - name: Determine version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Decide Full Release vs Pre Release.
          # - Manual runs: honor the release_type input.
          # - Tag pushes: treat SemVer pre-release tags (e.g. v0.6.0-rc1,
          #   v0.6.0-beta.2) as a Pre Release automatically.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.release_type }}" = "Pre Release" ]; then
              PRERELEASE=true
            else
              PRERELEASE=false
            fi
          elif [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "Prerelease: $PRERELEASE"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          if [ "$PRERELEASE" = "true" ]; then
            RELEASE_LABEL="Pre Release"
          else
            RELEASE_LABEL="Full Release"
          fi
          echo "Release label: $RELEASE_LABEL"
          echo "release_label=$RELEASE_LABEL" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Linux x86_64
  # ---------------------------------------------------------------------
  build-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - name: Stamp version (${{ needs.prepare.outputs.version }})
        run: bash scripts/stamp-version.sh "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.release_label }}"

      - name: Install build + X11/GL/WebView dev deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxxf86vm-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Build raylib from source
        run: |
          git clone --depth 1 --branch ${{ env.RAYLIB_VERSION }} \
            https://github.com/raysan5/raylib.git

          cmake \
            -S raylib \
            -B raylib/build \
            -DPLATFORM=Desktop \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build raylib/build -j"$(nproc)"
          sudo cmake --install raylib/build
          sudo ldconfig

      - name: Build chainlang
        run: make release

      - name: Verify stamped version
        run: |
          ./chainlang --version | tee /tmp/version-output.txt
          grep -q "${{ needs.prepare.outputs.version }}" /tmp/version-output.txt || {
            echo "error: built binary does not report the expected version (${{ needs.prepare.outputs.version }})" >&2
            exit 1
          }

      - name: Package
        run: |
          mkdir -p dist
          tar -czf \
            dist/chainlang-linux-x86_64.tar.gz \
            chainlang README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: chainlang-linux-x86_64
          path: dist/chainlang-linux-x86_64.tar.gz


  # ---------------------------------------------------------------------
  # Linux aarch64
  # ---------------------------------------------------------------------
  build-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - name: Stamp version (${{ needs.prepare.outputs.version }})
        run: bash scripts/stamp-version.sh "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.release_label }}"

      - name: Install build + X11/GL/WebView dev deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxxf86vm-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Build raylib from source
        run: |
          git clone --depth 1 --branch ${{ env.RAYLIB_VERSION }} \
            https://github.com/raysan5/raylib.git

          cmake \
            -S raylib \
            -B raylib/build \
            -DPLATFORM=Desktop \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build raylib/build -j"$(nproc)"
          sudo cmake --install raylib/build
          sudo ldconfig

      - name: Build chainlang
        run: make release

      - name: Verify stamped version
        run: |
          ./chainlang --version | tee /tmp/version-output.txt
          grep -q "${{ needs.prepare.outputs.version }}" /tmp/version-output.txt || {
            echo "error: built binary does not report the expected version (${{ needs.prepare.outputs.version }})" >&2
            exit 1
          }

      - name: Package
        run: |
          mkdir -p dist
          tar -czf \
            dist/chainlang-linux-aarch64.tar.gz \
            chainlang README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: chainlang-linux-aarch64
          path: dist/chainlang-linux-aarch64.tar.gz


  # ---------------------------------------------------------------------
  # Linux i686
  # ---------------------------------------------------------------------
  build-i686:
    name: Linux i686 (32-bit)
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - name: Stamp version (${{ needs.prepare.outputs.version }})
        run: bash scripts/stamp-version.sh "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.release_label }}"

      - name: Enable i386 + install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib \
            cmake \
            pkg-config \
            libgl1-mesa-dev:i386 \
            libx11-dev:i386 \
            libxrandr-dev:i386 \
            libxi-dev:i386 \
            libxcursor-dev:i386 \
            libxinerama-dev:i386 \
            libxxf86vm-dev:i386 \
            libgtk-3-dev:i386
            
      - name: Build raylib
        run: |
          git clone --depth 1 --branch ${{ env.RAYLIB_VERSION }} \
            https://github.com/raysan5/raylib.git

          cmake \
            -S raylib \
            -B raylib/build \
            -DPLATFORM=Desktop \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS=-m32 \
            -DCMAKE_CXX_FLAGS=-m32 \
            -DCMAKE_EXE_LINKER_FLAGS=-m32 \
            -DCMAKE_SHARED_LINKER_FLAGS=-m32

          cmake --build raylib/build -j"$(nproc)"
          sudo cmake --install raylib/build
          sudo ldconfig

      - name: Build chainlang
        run: |
          make release \
            CXXFLAGS="-std=c++17 -Wall -Wextra -I./include -m32 -DCHAIN_DISABLE_WEBVIEW" \
            LDFLAGS="-lraylib -lGL -lm -lpthread -ldl -lrt -lX11 -m32"

      - name: Package
        run: |
          mkdir -p dist
          tar -czf \
            dist/chainlang-linux-i686.tar.gz \
            chainlang README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: chainlang-linux-i686
          path: dist/chainlang-linux-i686.tar.gz


  # ---------------------------------------------------------------------
  # Linux riscv64
  # ---------------------------------------------------------------------
  build-riscv64:
    name: Linux riscv64 (experimental)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - name: Stamp version (${{ needs.prepare.outputs.version }})
        run: bash scripts/stamp-version.sh "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.release_label }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: Build inside riscv64 container
        run: |
          docker run \
            --rm \
            --platform linux/riscv64 \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            riscv64/ubuntu:24.04 \
            bash -c '
              set -e

              apt-get update

              apt-get install -y \
                build-essential \
                cmake \
                pkg-config \
                git \
                tar \
                file \
                libgl1-mesa-dev \
                libx11-dev \
                libxrandr-dev \
                libxi-dev \
                libxcursor-dev \
                libxinerama-dev \
                libxxf86vm-dev \
                libgtk-3-dev \
                libwebkit2gtk-4.1-dev

              git clone \
                --depth 1 \
                --branch 5.5 \
                https://github.com/raysan5/raylib.git

              cmake \
                -S raylib \
                -B raylib/build \
                -DPLATFORM=Desktop \
                -DBUILD_EXAMPLES=OFF \
                -DCMAKE_BUILD_TYPE=Release

              cmake --build raylib/build -j2
              cmake --install raylib/build
              ldconfig

              make release

              file chainlang
            '

      - name: Package
        run: |
          mkdir -p dist
          tar -czf \
            dist/chainlang-linux-riscv64.tar.gz \
            chainlang README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: chainlang-linux-riscv64
          path: dist/chainlang-linux-riscv64.tar.gz


 # ---------------------------------------------------------------------
  # Windows x86_64
  # ---------------------------------------------------------------------
  build-windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - name: Stamp version (${{ needs.prepare.outputs.version }})
        shell: bash
        run: bash scripts/stamp-version.sh "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.release_label }}"

      # MSYS2 provides MinGW64 GCC toolchain and make
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            tar
            make
            file
            mingw-w64-x86_64-toolchain

      # ---------------------------------------------------------------
      # Build Chain-Lang using local include/ and lib/ assets
      # ---------------------------------------------------------------
      - name: Build Chain-Lang
        shell: msys2 {0}
        run: |
          echo "Building Chain-Lang Windows x86_64"
          mingw32-make -f makefile.win clean
          mingw32-make -f makefile.win release

      # ---------------------------------------------------------------
      # Verify Windows executable
      # ---------------------------------------------------------------
      - name: Check Windows binary
        shell: msys2 {0}
        run: |
          file chainlang.exe
          objdump -f chainlang.exe

      # ---------------------------------------------------------------
      # Verify stamped version
      # ---------------------------------------------------------------
      - name: Verify stamped version
        shell: msys2 {0}
        run: |
          ./chainlang.exe --version | tee /tmp/version-output.txt
          grep -q "${{ needs.prepare.outputs.version }}" /tmp/version-output.txt || {
            echo "error: built binary does not report the expected version (${{ needs.prepare.outputs.version }})" >&2
            exit 1
          }

      # ---------------------------------------------------------------
      # Package (Include binary, runtime DLL, README, LICENSE)
      # ---------------------------------------------------------------
      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp lib/win_x86_64/WebView2Loader.dll ./ 2>/dev/null || true

          tar -czf \
            dist/chainlang-windows-x86_64.tar.gz \
            chainlang.exe \
            WebView2Loader.dll \
            README.md \
            LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: chainlang-windows-x86_64
          path: dist/chainlang-windows-x86_64.tar.gz


  # ---------------------------------------------------------------------
  # Publish GitHub Release
  # ---------------------------------------------------------------------
  release:
    name: Publish release

    # IMPORTANT:
    # This job ONLY runs for pushed tags (e.g. v0.6.0).
    #
    # workflow_dispatch on master will build the binaries,
    # but will NOT publish a release.
    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - prepare
      - build-x86_64
      - build-aarch64
      - build-i686
      - build-riscv64
      - build-windows-x86_64

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release files
        run: |
          mkdir -p release-assets

          find dist \
            -type f \
            -name "*.tar.gz" \
            -exec cp {} release-assets/ \;

          echo "Release files:"
          ls -lh release-assets

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS.txt

          echo "Checksums:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          draft: true
